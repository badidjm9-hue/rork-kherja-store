workflows:
  android-release-apk:
    name: Android Release APK
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "codemagic/android-setup"
          include: true
          source: true
      cancel_previous_builds: true
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android-kherja/local.properties"
      - name: Accept Android SDK licenses
        script: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build release APK
        working_directory: android-kherja
        script: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease
    artifacts:
      - android-kherja/app/build/outputs/apk/release/*.apk
