workflows:
  android-release-apk:
    name: Android Release APK
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      groups:
        - kherja_supabase
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "codemagic/android-setup"
          include: true
          source: true
        - pattern: "feature/kherja-continue"
          include: true
          source: true
      cancel_previous_builds: true
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android-kherja/local.properties"
      - name: Accept Android SDK licenses
        script: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Configure optional Firebase Android push credentials
        script: |
          if [ -n "${ANDROID_GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            python3 -c 'import os,base64,pathlib; pathlib.Path("android-kherja/app/google-services.json").write_bytes(base64.b64decode(os.environ["ANDROID_GOOGLE_SERVICES_JSON_BASE64"], validate=True))'
            python3 -m json.tool android-kherja/app/google-services.json > /dev/null
            echo "Firebase Android configuration is present"
          else
            echo "Firebase Android config not set; push registration remains disabled in this build"
          fi
      - name: Build release APK
        working_directory: android-kherja
        script: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease
    artifacts:
      - android-kherja/app/build/outputs/apk/release/*.apk

  kherja-android-debug:
    name: KHERJA Android Debug APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: android-kherja
    environment:
      groups:
        - kherja_supabase
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "feature/kherja-integrated"
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Check Supabase variables are set (values are never printed)
        script: |
          for v in EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY; do
            if [ -z "${!v:-}" ]; then
              echo "ERROR: $v is empty. Create the Codemagic variable group 'kherja_supabase' with EXPO_PUBLIC_SUPABASE_URL and EXPO_PUBLIC_SUPABASE_ANON_KEY."
              exit 1
            fi
            echo "$v is set"
          done
      - name: Configure Android SDK and optional Firebase push credentials
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          if [ -n "${ANDROID_GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            python3 -c 'import os,base64,pathlib; pathlib.Path("app/google-services.json").write_bytes(base64.b64decode(os.environ["ANDROID_GOOGLE_SERVICES_JSON_BASE64"], validate=True))'
            python3 -m json.tool app/google-services.json > /dev/null
            echo "Firebase Android configuration is present"
          else
            echo "Firebase Android config not set; push registration remains disabled in this build"
          fi
      - name: Build Android debug APK
        script: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug
    artifacts:
      - app/build/outputs/apk/**/*.apk
      - app/build/outputs/mapping/**/mapping.txt

  kherja-ios-simulator:
    name: KHERJA iOS Simulator Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - kherja_supabase
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "feature/kherja-integrated"
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Generate Config.swift from Supabase variables (CI workspace only, never committed)
        script: |
          for v in EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY; do
            if [ -z "${!v:-}" ]; then
              echo "ERROR: $v is empty. Create the Codemagic variable group 'kherja_supabase' with EXPO_PUBLIC_SUPABASE_URL and EXPO_PUBLIC_SUPABASE_ANON_KEY."
              exit 1
            fi
            echo "$v is set"
          done
          cat > ios-kherja/KHERJA/Config.swift <<EOF
          import Foundation

          enum Config {
              nonisolated static let EXPO_PUBLIC_SUPABASE_ANON_KEY = "${EXPO_PUBLIC_SUPABASE_ANON_KEY}"
              nonisolated static let EXPO_PUBLIC_SUPABASE_URL = "${EXPO_PUBLIC_SUPABASE_URL}"

              nonisolated static let allValues: [String: String] = [
                  "EXPO_PUBLIC_SUPABASE_ANON_KEY": EXPO_PUBLIC_SUPABASE_ANON_KEY,
                  "EXPO_PUBLIC_SUPABASE_URL": EXPO_PUBLIC_SUPABASE_URL,
              ]
          }
          EOF
      - name: Resolve Swift package dependencies
        script: |
          xcodebuild -resolvePackageDependencies \
            -project ios-kherja/KHERJA.xcodeproj \
            -scheme KHERJA
      - name: Build iOS app for Simulator
        script: |
          xcodebuild \
            -project ios-kherja/KHERJA.xcodeproj \
            -scheme KHERJA \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-derived \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - build/ios-derived/Build/Products/Debug-iphonesimulator/*.app
      - /tmp/xcodebuild_logs/*.log

  kherja-admin-web:
    name: KHERJA Admin Dashboard Web
    max_build_duration: 45
    instance_type: linux_x2
    environment:
      groups:
        - kherja_supabase
      node: 22
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "feature/kherja-integrated"
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Validate admin Supabase build variables
        script: |
          for v in EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY; do
            if [ -z "${!v:-}" ]; then
              echo "ERROR: $v is empty. Add it to the Codemagic group 'kherja_supabase'."
              exit 1
            fi
            echo "$v is set"
          done
      - name: Install admin dependencies
        working_directory: web-kherja-admin
        script: |
          npm install --no-audit --no-fund --package-lock=false
      - name: Build admin dashboard
        working_directory: web-kherja-admin
        script: |
          export VITE_SUPABASE_URL="$EXPO_PUBLIC_SUPABASE_URL"
          export VITE_SUPABASE_ANON_KEY="$EXPO_PUBLIC_SUPABASE_ANON_KEY"
          npm run build
    artifacts:
      - web-kherja-admin/dist/**
