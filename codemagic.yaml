workflows:
  android-release-apk:
    name: Android Release APK
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "codemagic/android-setup"
          include: true
          source: true
        - pattern: "feature/kherja-continue"
          include: true
          source: true
      cancel_previous_builds: true
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android-kherja/local.properties"
      - name: Accept Android SDK licenses
        script: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build release APK
        working_directory: android-kherja
        script: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease
    artifacts:
      - android-kherja/app/build/outputs/apk/release/*.apk

  kherja-android-debug:
    name: KHERJA Android Debug APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: android-kherja
    environment:
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "feature/kherja-ui-complete"
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Configure Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Build Android debug APK
        script: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug
    artifacts:
      - app/build/outputs/apk/**/*.apk
      - app/build/outputs/mapping/**/mapping.txt

  kherja-ios-simulator:
    name: KHERJA iOS Simulator Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "feature/kherja-ui-complete"
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Resolve Swift package dependencies
        script: |
          xcodebuild -resolvePackageDependencies \
            -project ios-kherja/KHERJA.xcodeproj \
            -scheme KHERJA
      - name: Build iOS app for Simulator
        script: |
          xcodebuild \
            -project ios-kherja/KHERJA.xcodeproj \
            -scheme KHERJA \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-derived \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - build/ios-derived/Build/Products/Debug-iphonesimulator/*.app
      - /tmp/xcodebuild_logs/*.log
