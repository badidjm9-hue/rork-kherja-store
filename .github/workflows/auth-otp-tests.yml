name: Auth OTP tests

on:
  pull_request:
    paths:
      - "supabase/functions/auth-otp/**"
      - "supabase/migrations/000*.sql"
      - ".github/workflows/auth-otp-tests.yml"
  push:
    branches:
      - "security/auth-rate-limit-otp-hash"
    paths:
      - "supabase/functions/auth-otp/**"
      - "supabase/migrations/000*.sql"
      - ".github/workflows/auth-otp-tests.yml"

permissions:
  contents: read

jobs:
  auth-otp:
    name: Bun unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Run auth OTP tests
        run: bun test supabase/functions/auth-otp
